name: Validate contracts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      # Service-local test dependencies (each service owns its requirements file).
      - run: python -m pip install -r services/goal-intelligence/requirements.txt
      - run: python scripts/validate_contracts.py
      - run: python -m pytest -q
