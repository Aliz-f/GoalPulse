name: Phase 2 release gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase2-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recorded:
    name: Recorded A1-D5 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install approved test/runtime dependencies
        run: >-
          python -m pip install
          -r requirements-dev.txt
          -r infrastructure/gateway/requirements.txt
          -r services/goal-intelligence/requirements.txt
          -r services/goal-management/requirements.txt
          -r services/discovery-monitoring/requirements.txt
          -r services/data-evidence/requirements.txt
          -r services/goal-evaluation/requirements.txt
          -r services/notification/requirements.txt
          -r services/agent-integration/requirements.txt
      - name: Run deterministic recorded release lane
        run: python infrastructure/release/run_phase2_gate.py --lane recorded --output /tmp/r2-d1-03-recorded.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-d1-03-recorded-evidence
          path: /tmp/r2-d1-03-recorded.json
          retention-days: 14

  durable:
    name: PostgreSQL and Rabbit replay/restart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goalpulse_ci
          POSTGRES_PASSWORD: goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-db
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U goalpulse_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: goalpulse_ci
          RABBITMQ_DEFAULT_PASS: goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-mq
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 12
    env:
      PHASE2_CI_POSTGRES_ADMIN_URL: postgresql://goalpulse_ci:goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-db@127.0.0.1:5432/postgres
      PHASE2_CI_RABBITMQ_URL: amqp://goalpulse_ci:goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-mq@127.0.0.1:5672/%2F
      GI_TEST_POSTGRES_URL: postgresql://goalpulse_ci:goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-db@127.0.0.1:5432/postgres
      GOAL_MANAGEMENT_TEST_DATABASE_URL: postgresql://goalpulse_ci:goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-db@127.0.0.1:5432/goal_management_test
      GOALPULSE_DM_TEST_DSN: postgresql://goalpulse_ci:goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-db@127.0.0.1:5432/discovery_monitoring_test
      GOALPULSE_DE_TEST_DSN: postgresql://goalpulse_ci:goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-db@127.0.0.1:5432/data_evidence_test
      GOALPULSE_GE_TEST_DSN: postgresql://goalpulse_ci:goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-db@127.0.0.1:5432/postgres
      GOALPULSE_GE_TEST_AMQP_URL: amqp://goalpulse_ci:goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-mq@127.0.0.1:5672/%2F
      GOALPULSE_NS_TEST_DSN: postgresql://goalpulse_ci:goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-db@127.0.0.1:5432/postgres
      GOALPULSE_AI_TEST_DSN: postgresql://goalpulse_ci:goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-db@127.0.0.1:5432/postgres
      GOALPULSE_AI_TEST_AMQP_URL: amqp://goalpulse_ci:goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-mq@127.0.0.1:5672/%2F
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install approved test/runtime dependencies
        run: >-
          python -m pip install
          -r requirements-dev.txt
          -r infrastructure/gateway/requirements.txt
          -r services/goal-intelligence/requirements.txt
          -r services/goal-management/requirements.txt
          -r services/discovery-monitoring/requirements.txt
          -r services/data-evidence/requirements.txt
          -r services/goal-evaluation/requirements.txt
          -r services/notification/requirements.txt
          -r services/agent-integration/requirements.txt
      - name: Provision disposable integration services
        run: python infrastructure/release/bootstrap_ci_services.py
      - name: Apply Goal Management migration
        env:
          GOAL_MANAGEMENT_DATABASE_URL: postgresql://goalpulse_ci:goalpulse-${{ github.run_id }}-${{ github.run_attempt }}-db@127.0.0.1:5432/goal_management_test
          PYTHONPATH: services/goal-management/src
        run: python -m goal_management.migrate
      - name: Run durable replay/restart lane
        run: python infrastructure/release/run_phase2_gate.py --lane durable --output /tmp/r2-d1-03-durable.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-d1-03-durable-evidence
          path: /tmp/r2-d1-03-durable.json
          retention-days: 14

  frontend:
    name: Node 22 browser and no-silent-mock lane
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser/build release lane
        run: python infrastructure/release/run_phase2_gate.py --lane frontend --output /tmp/r2-d1-03-frontend.json
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-d1-03-frontend-evidence
          path: /tmp/r2-d1-03-frontend.json
          retention-days: 14

  compose:
    name: Isolated Compose readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create non-live disposable configuration
        run: python infrastructure/release/write_compose_ci_env.py /tmp/goalpulse-release.env
      - name: Validate Compose expansion
        run: docker compose -f infrastructure/docker-compose.yml --env-file /tmp/goalpulse-release.env config --quiet
      - name: Build and wait for required readiness
        run: docker compose -f infrastructure/docker-compose.yml --env-file /tmp/goalpulse-release.env up -d --build --wait --wait-timeout 240
      - name: Restart database and broker, then require recovery
        run: |
          docker compose -f infrastructure/docker-compose.yml --env-file /tmp/goalpulse-release.env restart postgres rabbitmq
          docker compose -f infrastructure/docker-compose.yml --env-file /tmp/goalpulse-release.env up -d --wait --wait-timeout 240
      - name: Record service state
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml --env-file /tmp/goalpulse-release.env ps --all
