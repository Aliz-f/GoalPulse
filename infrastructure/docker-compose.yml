name: goalpulse-local
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      GOAL_INTELLIGENCE_DB_PASSWORD: ${GOAL_INTELLIGENCE_DB_PASSWORD:?Set GOAL_INTELLIGENCE_DB_PASSWORD}
      GOAL_MANAGEMENT_DB_PASSWORD: ${GOAL_MANAGEMENT_DB_PASSWORD:?Set GOAL_MANAGEMENT_DB_PASSWORD}
      DISCOVERY_MONITORING_DB_PASSWORD: ${DISCOVERY_MONITORING_DB_PASSWORD:?Set DISCOVERY_MONITORING_DB_PASSWORD}
      DATA_EVIDENCE_DB_PASSWORD: ${DATA_EVIDENCE_DB_PASSWORD:?Set DATA_EVIDENCE_DB_PASSWORD}
      GOAL_EVALUATION_DB_PASSWORD: ${GOAL_EVALUATION_DB_PASSWORD:?Set GOAL_EVALUATION_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD}
      AGENT_INTEGRATION_DB_PASSWORD: ${AGENT_INTEGRATION_DB_PASSWORD:?Set AGENT_INTEGRATION_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-create-service-dbs.sh:/docker-entrypoint-initdb.d/01-create-service-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [data]
  rabbitmq-init:
    image: rabbitmq:4-management-alpine
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    command:
      - /bin/sh
      - -ec
      - >-
        rabbitmqadmin --host rabbitmq --port 15672
        --username "$$RABBITMQ_DEFAULT_USER" --password "$$RABBITMQ_DEFAULT_PASS"
        definitions import --file /etc/rabbitmq/definitions.json
    networks: [data]
  goal-intelligence-migrate:
    build:
      context: ..
      dockerfile: infrastructure/images/python-service.Dockerfile
      args:
        SERVICE_PATH: services/goal-intelligence
    restart: "no"
    working_dir: /workspace/services/goal-intelligence
    command: ["python", "-m", "goal_intelligence.persistence.migrate"]
    environment:
      GI_DATABASE_URL: postgresql://goal_intelligence:${GOAL_INTELLIGENCE_DB_PASSWORD:?Set GOAL_INTELLIGENCE_DB_PASSWORD}@postgres:5432/goal_intelligence
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
  goal-intelligence:
    build:
      context: ..
      dockerfile: infrastructure/images/python-service.Dockerfile
      args:
        SERVICE_PATH: services/goal-intelligence
    restart: unless-stopped
    working_dir: /workspace/services/goal-intelligence
    command:
      - uvicorn
      - goal_intelligence.api.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    environment:
      GOALPULSE_PROFILE: ${GOALPULSE_PROFILE:-dev}
      GI_DATABASE_URL: postgresql://goal_intelligence:${GOAL_INTELLIGENCE_DB_PASSWORD:?Set GOAL_INTELLIGENCE_DB_PASSWORD}@postgres:5432/goal_intelligence
      GI_LLM_PROVIDER: ${GI_LLM_PROVIDER:-fixture}
      GI_LLM_MODEL: ${GI_LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?Set SERVICE_JWT_SECRET}
      SERVICE_JWT_ISSUER: ${SERVICE_JWT_ISSUER:?Set SERVICE_JWT_ISSUER}
      SERVICE_JWT_AUDIENCE: ${SERVICE_JWT_AUDIENCE:?Set SERVICE_JWT_AUDIENCE}
    depends_on:
      goal-intelligence-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
    expose: ["8000"]
    networks: [app, data]
  gateway:
    build:
      context: gateway
    restart: unless-stopped
    environment:
      GOALPULSE_PROFILE: ${GOALPULSE_PROFILE:-dev}
      GATEWAY_DEMO_ALLOWED_ORIGIN: ${GATEWAY_DEMO_ALLOWED_ORIGIN:-http://localhost:3000}
      GATEWAY_DEV_JWT_SECRET: ${GATEWAY_DEV_JWT_SECRET:?Set GATEWAY_DEV_JWT_SECRET}
      GATEWAY_JWT_ISSUER: ${GATEWAY_JWT_ISSUER:?Set GATEWAY_JWT_ISSUER}
      GATEWAY_JWT_AUDIENCE: ${GATEWAY_JWT_AUDIENCE:?Set GATEWAY_JWT_AUDIENCE}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?Set SERVICE_JWT_SECRET}
      SERVICE_JWT_ISSUER: ${SERVICE_JWT_ISSUER:?Set SERVICE_JWT_ISSUER}
      SERVICE_JWT_AUDIENCE: ${SERVICE_JWT_AUDIENCE:?Set SERVICE_JWT_AUDIENCE}
      GOAL_INTELLIGENCE_URL: http://goal-intelligence:8000
      GOAL_MANAGEMENT_URL: http://goal-management:8000
      GATEWAY_DEMO_SESSION_SECRET: ${GATEWAY_DEMO_SESSION_SECRET:-}
      GATEWAY_DEMO_SESSION_TTL_SECONDS: ${GATEWAY_DEMO_SESSION_TTL_SECONDS:-1800}
      GATEWAY_DEMO_USER_A_ID: ${GATEWAY_DEMO_USER_A_ID:-}
      GATEWAY_DEMO_USER_A_USERNAME: ${GATEWAY_DEMO_USER_A_USERNAME:-}
      GATEWAY_DEMO_USER_A_PASSWORD_HASH: ${GATEWAY_DEMO_USER_A_PASSWORD_HASH:-}
      GATEWAY_DEMO_USER_A_DISPLAY_NAME: ${GATEWAY_DEMO_USER_A_DISPLAY_NAME:-}
      GATEWAY_DEMO_USER_B_ID: ${GATEWAY_DEMO_USER_B_ID:-}
      GATEWAY_DEMO_USER_B_USERNAME: ${GATEWAY_DEMO_USER_B_USERNAME:-}
      GATEWAY_DEMO_USER_B_PASSWORD_HASH: ${GATEWAY_DEMO_USER_B_PASSWORD_HASH:-}
      GATEWAY_DEMO_USER_B_DISPLAY_NAME: ${GATEWAY_DEMO_USER_B_DISPLAY_NAME:-}
      NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-}
      GI_LLM_PROVIDER: ${GI_LLM_PROVIDER:-fixture}
      GI_LLM_MODEL: ${GI_LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CONTEXT_DEV_API_KEY: ${CONTEXT_DEV_API_KEY:-}
      DE_EVIDENCE_PROVIDER: ${DE_EVIDENCE_PROVIDER:-}
      DE_ALLOW_FIXTURE: ${DE_ALLOW_FIXTURE:-false}
    depends_on:
      goal-intelligence:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [app]
volumes:
  postgres_data:
  rabbitmq_data:
networks:
  app: {}
  data: {}
